# AWS deployment. Manual: Actions > AWS deploy > Run workflow (branch: main).
# Automatic: a push to main that changes shipped files redeploys staging if the server is up.
# One server runs both environments: production on port 8080, staging on 8081, each with
# its own CloudFront site (deploy/aws/install-env.sh sets them up on the server).
# One-time setup and architecture: deploy/aws/README.md
name: AWS deploy

on:
  push:
    branches: [main]
    paths: # exactly what the code bundle contains; other pushes must not restart the game
      - "tank_tactics/**"
      - "public/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      action:
        description: "up = create, redeploy = ship code and keep data, down = delete all game data"
        type: choice
        required: true
        default: redeploy
        options: [up, redeploy, down]
      environment:
        description: "Environment to redeploy (up and down always cover both)"
        type: choice
        default: staging
        options: [staging, production]
      instance_type:
        description: "Instance type (used by up)"
        type: choice
        default: t4g.small
        options: [t4g.small, t4g.micro]
      confirm:
        description: "For down only: type DELETE"
        type: string
        required: false

permissions:
  contents: read
  id-token: write # lets the job request short-lived AWS credentials through OIDC

concurrency:
  group: aws-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  APP: tank-tactics
  SG_NAME: tank-tactics-web
  INSTANCE_PROFILE: tank-tactics-ec2
  ACTION: ${{ inputs.action || 'redeploy' }} # inputs are empty on push
  TARGET: ${{ inputs.environment || 'staging' }}
  PRODUCTION_PORT: 8080
  PRODUCTION_UNIT: tank-tactics
  PRODUCTION_COMMENT: Tank Tactics
  STAGING_PORT: 8081
  STAGING_UNIT: tank-tactics-staging
  STAGING_COMMENT: Tank Tactics staging
  INSTANCE_TYPE: ${{ inputs.instance_type }}
  CONFIRM: ${{ inputs.confirm }}

jobs:
  deploy:
    name: ${{ inputs.action == 'up' && 'up' || inputs.action == 'down' && 'down' || format('redeploy {0}', inputs.environment || 'staging') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check inputs
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main."; exit 1
          fi
          if [ "$ACTION" = down ] && [ "$CONFIRM" != DELETE ]; then
            echo "::error::down deletes all game data, production and staging. Type DELETE in the confirm box."; exit 1
          fi

      - uses: actions/checkout@v7

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Set deployment bucket
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET=$APP-deploy-$account" >> "$GITHUB_ENV"

      # Runs after any queued up/down has finished (see concurrency), so it sees the final state.
      - name: Find server
        id: target
        if: env.ACTION == 'redeploy'
        run: |
          instance=$(aws ec2 describe-instances \
            --filters "Name=tag:app,Values=$APP" Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$instance" != None ]; then
            echo "INSTANCE=$instance" >> "$GITHUB_ENV"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### Skipped: server is not up" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::No running server. Run the workflow with action up."; exit 1
          fi

      - name: Upload code bundle
        if: env.ACTION != 'down' && steps.target.outputs.skip != 'true'
        run: |
          git archive --format=tar.gz -o app.tar.gz HEAD -- tank_tactics public requirements.txt
          aws s3 cp app.tar.gz "s3://$BUCKET/app.tar.gz" --only-show-errors
          sed -e "s/__BUCKET__/$BUCKET/g" -e "s/__REGION__/$AWS_REGION/g" \
            deploy/aws/install-env.sh > install-env.rendered.sh

      - name: Create server
        if: env.ACTION == 'up'
        run: |
          existing=$(aws ec2 describe-instances \
            --filters "Name=tag:app,Values=$APP" Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$existing" ]; then
            echo "::error::$APP is already up ($existing). Use redeploy, or run down first."; exit 1
          fi

          vpc=$(aws ec2 describe-vpcs --filters Name=is-default,Values=true --query 'Vpcs[0].VpcId' --output text)
          subnet=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc" Name=default-for-az,Values=true \
            --query 'sort_by(Subnets,&AvailabilityZone)[0].SubnetId' --output text)
          ami=$(aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64 \
            --query Parameter.Value --output text)

          sg=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=$SG_NAME" "Name=vpc-id,Values=$vpc" \
            --query 'SecurityGroups[0].GroupId' --output text)
          if [ "$sg" = None ]; then
            # The "Open site" step lets CloudFront in on each environment's port.
            sg=$(aws ec2 create-security-group --group-name "$SG_NAME" --vpc-id "$vpc" \
              --description "Tank Tactics: app ports from CloudFront only" \
              --tag-specifications "ResourceType=security-group,Tags=[{Key=app,Value=$APP}]" \
              --query GroupId --output text)
          fi

          fetch_config=$(gzip -9c deploy/aws/fetch-config.sh | base64 -w0)
          install_env=$(gzip -9c install-env.rendered.sh | base64 -w0)
          sed -e "s|__FETCH_CONFIG_B64__|$fetch_config|g" -e "s|__INSTALL_B64__|$install_env|g" \
              deploy/aws/userdata.sh > userdata.rendered.sh
          instance=$(aws ec2 run-instances --image-id "$ami" --instance-type "$INSTANCE_TYPE" --subnet-id "$subnet" \
            --security-group-ids "$sg" --iam-instance-profile "Name=$INSTANCE_PROFILE" \
            --credit-specification CpuCredits=standard \
            --metadata-options HttpTokens=required,HttpEndpoint=enabled,HttpPutResponseHopLimit=1 \
            --block-device-mappings 'DeviceName=/dev/xvda,Ebs={VolumeSize=10,VolumeType=gp3,Encrypted=true,DeleteOnTermination=false}' \
            --user-data file://userdata.rendered.sh \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=$APP},{Key=app,Value=$APP}]" \
                                 "ResourceType=volume,Tags=[{Key=Name,Value=$APP-root},{Key=app,Value=$APP},{Key=backup,Value=daily}]" \
            --query 'Instances[0].InstanceId' --output text)
          allocation=$(aws ec2 allocate-address --domain vpc \
            --tag-specifications "ResourceType=elastic-ip,Tags=[{Key=Name,Value=$APP},{Key=app,Value=$APP}]" \
            --query AllocationId --output text)
          aws ec2 wait instance-running --instance-ids "$instance"
          aws ec2 associate-address --instance-id "$instance" --allocation-id "$allocation" >/dev/null
          echo "INSTANCE=$instance" >> "$GITHUB_ENV"

      - name: Ship code to server
        if: env.ACTION == 'redeploy' && steps.target.outputs.skip != 'true'
        run: |
          unit_var="${TARGET^^}_UNIT" port_var="${TARGET^^}_PORT"
          unit=${!unit_var} port=${!port_var}
          # Refresh the server scripts (older servers have older copies, or none), then pull
          # settings from SSM Parameter Store. If that fails, the command stops before the
          # restart and the old version keeps running. The installer also creates the
          # environment on servers that predate it. The last command fails the deploy
          # unless the restarted server reports Google sign-in as on.
          install_config="echo $(base64 -w0 deploy/aws/fetch-config.sh) | base64 -d > /usr/local/bin/tank-tactics-config"
          install_env="echo $(base64 -w0 install-env.rendered.sh) | base64 -d > /usr/local/bin/tank-tactics-install"
          check_sign_in="for i in \$(seq 1 20); do curl -fsS http://127.0.0.1:$port/api/auth/config | grep -q '\"google_client_id\":\"[^\"]' && exit 0; sleep 1; done; echo 'Google sign-in is off after restart' >&2; exit 1"
          params=$(jq -n --arg config "$install_config" --arg install "$install_env" --arg check "$check_sign_in" \
            --arg target "$TARGET" --arg unit "$unit" '{commands: [
            "set -e", $config, $install,
            "chmod 755 /usr/local/bin/tank-tactics-config /usr/local/bin/tank-tactics-install",
            "/usr/local/bin/tank-tactics-config", "/usr/local/bin/tank-tactics-install \($target)",
            "sleep 3", "systemctl is-active \($unit)", $check]}')
          command=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --parameters "$params" --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command" --instance-id "$INSTANCE" || true
          status=$(aws ssm get-command-invocation --command-id "$command" --instance-id "$INSTANCE" \
            --query Status --output text)
          aws ssm get-command-invocation --command-id "$command" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text | grep '^Google sign-in:' || true
          aws ssm get-command-invocation --command-id "$command" --instance-id "$INSTANCE" \
            --query StandardErrorContent --output text | tail -n 20
          if [ "$status" != Success ]; then
            echo "::error::Deploy command finished with status $status"; exit 1
          fi
          echo "### Redeployed $TARGET: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      # For each environment: let CloudFront reach its port, create its distribution if it has
      # none (a redeploy does this for an environment the server didn't have before), and check
      # the site through CloudFront.
      - name: Open site
        if: (env.ACTION == 'up' || env.ACTION == 'redeploy') && steps.target.outputs.skip != 'true'
        run: |
          if [ "$ACTION" = up ]; then sites="production staging"; else sites=$TARGET; fi
          read -r origin sg < <(aws ec2 describe-instances --instance-ids "$INSTANCE" \
            --query 'Reservations[0].Instances[0].[PublicDnsName,SecurityGroups[0].GroupId]' --output text)
          prefix_list=$(aws ec2 describe-managed-prefix-lists \
            --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing \
            --query 'PrefixLists[0].PrefixListId' --output text)

          for site in $sites; do
            port_var="${site^^}_PORT" comment_var="${site^^}_COMMENT"
            port=${!port_var} comment=${!comment_var}

            open=$(aws ec2 describe-security-groups --group-ids "$sg" \
              --query "length(SecurityGroups[0].IpPermissions[?FromPort==\`$port\`])" --output text)
            if [ "$open" = 0 ]; then
              aws ec2 authorize-security-group-ingress --group-id "$sg" --ip-permissions \
                "IpProtocol=tcp,FromPort=$port,ToPort=$port,PrefixListIds=[{PrefixListId=$prefix_list,Description=CloudFront origin-facing}]" \
                >/dev/null
            fi

            domain=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Comment=='$comment' && Enabled].DomainName | [0]" --output text)
            if [ "$domain" = None ] || [ -z "$domain" ]; then
              # Managed policies: CachingDisabled and AllViewerExceptHostHeader.
              jq -n --arg ref "$APP-$site-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --arg comment "$comment" \
                    --arg origin "$origin" --arg id "$APP-ec2" --argjson port "$port" '{
                CallerReference: $ref, Comment: $comment, Enabled: true,
                PriceClass: "PriceClass_100", HttpVersion: "http2and3", IsIPV6Enabled: true,
                Origins: {Quantity: 1, Items: [{Id: $id, DomainName: $origin, CustomOriginConfig: {
                  HTTPPort: $port, HTTPSPort: 443, OriginProtocolPolicy: "http-only",
                  OriginSslProtocols: {Quantity: 1, Items: ["TLSv1.2"]},
                  OriginReadTimeout: 60, OriginKeepaliveTimeout: 60}}]},
                DefaultCacheBehavior: {
                  TargetOriginId: $id, ViewerProtocolPolicy: "redirect-to-https", Compress: true,
                  AllowedMethods: {Quantity: 7, Items: ["GET","HEAD","OPTIONS","PUT","POST","PATCH","DELETE"],
                    CachedMethods: {Quantity: 2, Items: ["GET","HEAD"]}},
                  CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad",
                  OriginRequestPolicyId: "b689b0a8-53d0-40ab-baf2-68738e2966ac"}
              }' > "cloudfront-$site.json"
              read -r id domain < <(aws cloudfront create-distribution \
                --distribution-config "file://cloudfront-$site.json" \
                --query 'Distribution.[Id,DomainName]' --output text)
              aws cloudfront wait distribution-deployed --id "$id"
              echo "::notice::New $site address https://$domain: add it to the Google OAuth client's Authorized JavaScript origins."
            fi

            code=000
            for _ in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://$domain/api/defaults" || true)
              [ "$code" = 200 ] && break
              sleep 10
            done
            if [ "$code" != 200 ]; then
              echo "::error::https://$domain/api/defaults returned $code"; exit 1
            fi
            if ! curl -fsS "https://$domain/api/auth/config" | jq -e '.google_client_id | length > 0' >/dev/null; then
              echo "::error::Google sign-in is off on https://$domain. Check the /tank-tactics/google-client-id parameter."
              exit 1
            fi
            # Also print the site URL to the log (the summary isn't readable through the API).
            echo "Site URL ($site): https://$domain"
            echo "### $site: https://$domain" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Delete deployment
        if: env.ACTION == 'down'
        run: |
          ids=$(aws cloudfront list-distributions --query \
            "DistributionList.Items[?Comment=='$PRODUCTION_COMMENT' || Comment=='$STAGING_COMMENT'].Id" --output text)
          [ "$ids" = None ] && ids=""
          for id in $ids; do
            aws cloudfront get-distribution-config --id "$id" --output json > dist.json
            if [ "$(jq -r .DistributionConfig.Enabled dist.json)" = true ]; then
              jq .DistributionConfig.Enabled=false dist.json | jq .DistributionConfig > dist-off.json
              aws cloudfront update-distribution --id "$id" --if-match "$(jq -r .ETag dist.json)" \
                --distribution-config file://dist-off.json >/dev/null
            fi
          done

          instances=$(aws ec2 describe-instances \
            --filters "Name=tag:app,Values=$APP" Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$instances" ]; then
            # shellcheck disable=SC2086
            aws ec2 terminate-instances --instance-ids $instances >/dev/null
            # shellcheck disable=SC2086
            aws ec2 wait instance-terminated --instance-ids $instances
          fi
          for a in $(aws ec2 describe-addresses --filters "Name=tag:app,Values=$APP" \
              --query 'Addresses[].AllocationId' --output text); do
            aws ec2 release-address --allocation-id "$a"
          done
          for v in $(aws ec2 describe-volumes --filters "Name=tag:app,Values=$APP" Name=status,Values=available \
              --query 'Volumes[].VolumeId' --output text); do
            aws ec2 delete-volume --volume-id "$v"
          done
          for s in $(aws ec2 describe-security-groups --filters "Name=tag:app,Values=$APP" \
              --query 'SecurityGroups[].GroupId' --output text); do
            aws ec2 delete-security-group --group-id "$s" >/dev/null
          done
          for s in $(aws ec2 describe-snapshots --owner-ids self --filters "Name=tag:app,Values=$APP" \
              --query 'Snapshots[].SnapshotId' --output text); do
            aws ec2 delete-snapshot --snapshot-id "$s"
          done
          aws s3 rm "s3://$BUCKET/app.tar.gz" --only-show-errors

          for id in $ids; do
            aws cloudfront wait distribution-deployed --id "$id"
            etag=$(aws cloudfront get-distribution --id "$id" --query ETag --output text)
            aws cloudfront delete-distribution --id "$id" --if-match "$etag"
          done
          echo "### Down (production and staging)" >> "$GITHUB_STEP_SUMMARY"
