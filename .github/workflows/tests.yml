# Runs the full test suite on every push, for the pushed branch.
# To block merging when it fails, add "tests" as a required status check in a branch
# ruleset (Settings > Rules > Rulesets) targeting the branches you merge into.
name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true # a newer push to the same branch supersedes the older run

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches the production server (deploy/aws/userdata.sh)
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Without a browser the UI tests skip instead of failing, so install one explicitly.
      - name: Install browser for UI tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q -rs
