AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Permanent, no-compute foundation for the Tank Tactics GitHub Actions deployment:
  GitHub OIDC access, the instance role, the code bucket, the daily snapshot policy and
  the www-to-apex redirect for the site's domain.

Parameters:
  GitHubRepo:
    Type: String
    Description: >-
      The repository as GitHub's OIDC subject names it. This repo uses immutable
      owner@id/repo@id subjects, so the plain owner/repo form would not match.
    Default: TomyCatomy@62501688/tank-tactics@1465481455
    AllowedPattern: "[A-Za-z0-9_.@-]+/[A-Za-z0-9_.@-]+"
  Domain:
    Type: String
    Description: Apex domain of the site. Its Route 53 zone and ACM certificate are made by hand.
    Default: tanktactics.io

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub tank-tactics-deploy-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - {Key: app, Value: tank-tactics}

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tank-tactics-ec2
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-deploy-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DeployBucket.Arn}/app.tar.gz

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: tank-tactics-ec2
      Roles: [!Ref InstanceRole]

  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tank-tactics-snapshots
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: dlm.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  DailySnapshots:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: Tank Tactics daily snapshots keep 7
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        ResourceTypes: [VOLUME]
        TargetTags:
          - {Key: backup, Value: daily}
        Schedules:
          - Name: daily-7
            CopyTags: true
            CreateRule:
              Interval: 24
              IntervalUnit: HOURS
              Times: ["03:00"]
            RetainRule:
              Count: 7

  # Sends www.<domain> to the apex, so every player shares one origin (and its saved seats).
  WwwRedirect:
    Type: AWS::CloudFront::Function
    Properties:
      Name: tank-tactics-www-redirect
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www to the apex domain
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          if (request.headers.host.value !== 'www.${Domain}') return request;
          var query = Object.keys(request.querystring).map(function (key) {
            var item = request.querystring[key];
            var values = item.multiValue ? item.multiValue : [item];
            return values.map(function (v) { return v.value === '' ? key : key + '=' + v.value; }).join('&');
          }).join('&');
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {location: {value: 'https://${Domain}' + request.uri + (query ? '?' + query : '')}}
          };
        }

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tank-tactics-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadEc2
                Effect: Allow
                Action:
                  - ec2:DescribeAddresses
                  - ec2:DescribeInstances
                  - ec2:DescribeManagedPrefixLists
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSnapshots
                  - ec2:DescribeSubnets
                  - ec2:DescribeVolumes
                  - ec2:DescribeVpcs
                Resource: "*"
              - Sid: LaunchSupportingResources
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}::image/*
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
              - Sid: LaunchApprovedInstanceTypes
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ec2:InstanceType: [t4g.small, t4g.micro]
              - Sid: PassInstanceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt InstanceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Sid: CreateNetworkResources
                Effect: Allow
                Action:
                  - ec2:AllocateAddress
                  - ec2:CreateSecurityGroup
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: TagOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: [RunInstances, CreateSecurityGroup, AllocateAddress]
              - Sid: AttachAddress
                Effect: Allow
                Action: ec2:AssociateAddress
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: ChangeOwnedEc2
                Effect: Allow
                Action:
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteSnapshot
                  - ec2:DeleteVolume
                  - ec2:ReleaseAddress
                  - ec2:TerminateInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/app: tank-tactics
              - Sid: OpenPortOnOwnedSecurityGroup
                Effect: Allow
                Action: ec2:AuthorizeSecurityGroupIngress
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/app: tank-tactics
              - Sid: CreateIngressRule
                Effect: Allow
                Action: ec2:AuthorizeSecurityGroupIngress
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group-rule/*
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:aws:prefix-list/*
              - Sid: LatestAmi
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/ami-amazon-linux-latest/*
              - Sid: RunShellDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Sid: RunOnOwnedInstance
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/app: tank-tactics
              - Sid: ReadCommandResult
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: "*"
              - Sid: CodeBundle
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:PutObject
                Resource: !Sub ${DeployBucket.Arn}/app.tar.gz
              - Sid: CloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:ListDistributions
                  - cloudfront:UpdateDistribution
                Resource: "*"
              - Sid: ReadDomainSetup
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                  - cloudfront:DescribeFunction
                  - route53:GetChange
                  - route53:ListHostedZonesByName
                  - route53:ListResourceRecordSets
                Resource: "*"
              - Sid: PointDomainAtCloudFront
                Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/*
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames: [!Ref Domain, !Sub "www.${Domain}"]
                    route53:ChangeResourceRecordSetsRecordTypes: [A, AAAA]
                  "Null":
                    route53:ChangeResourceRecordSetsNormalizedRecordNames: "false"

Outputs:
  GitHubRoleArn:
    Description: Set this as the AWS_ROLE_ARN repository variable
    Value: !GetAtt GitHubDeployRole.Arn
